# Quality gate for `make eval` and the CI job "Evaluation".
#
# `min`: the metric must be at least this; `max`: at most this.
# Isolation limits are absolute and the same for every profile. Quality floors
# are the recorded baseline (eval/reports/offline.md) minus about one question:
# the offline profile is deterministic, so a drop is a real change, and a margin
# of one question keeps a deliberate trade-off reviewable instead of blocked.
# Raise a floor when the baseline improves; lowering one needs a reason in the PR.

[offline]
require_calibrated_threshold = true

[offline.min]
hit_at_5 = 0.98             # baseline 1.000 (56/56)
mrr = 0.95                  # baseline 0.991
answer_accuracy = 0.92      # baseline 0.946 (53/56)
citation_precision = 0.90   # baseline 0.938
faithfulness = 0.95         # baseline 1.000
abstention_accuracy = 0.97  # baseline 0.989 (87/88)
abstention_recall = 0.93    # baseline 0.966 (28/29)

[offline.max]
leaked_chunks = 0
forbidden_facts = 0
false_abstention_rate = 0.04  # baseline 0.000

# Hosted models: isolation only until a baseline is recorded with a key
# (`KB_EVAL_PROFILE=openai make eval`, docs/EVALUATION.md).
[openai.max]
leaked_chunks = 0
forbidden_facts = 0
