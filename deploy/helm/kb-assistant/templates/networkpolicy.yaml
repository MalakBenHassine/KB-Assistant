{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
{{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")))) "ports" (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) -}}
# Default deny for every pod of this release; the policies below open exactly
# the paths the architecture needs (SECURITY.md T7: the worker reaches only
# its dependencies, so a malicious document cannot make it call anything else).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kb.fullname" . }}-default-deny
  labels: {{- include "kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kb.fullname" . }}-web
  labels: {{- include "kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kb.selector" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
      ports: [{ port: 3000 }]
  egress:
    - {{- toYaml $dns | nindent 6 }}
    - to:
        - podSelector:
            matchLabels: {{- include "kb.selector" (dict "root" . "component" "api") | nindent 14 }}
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kb.fullname" . }}-api
  labels: {{- include "kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kb.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "kb.selector" (dict "root" . "component" "web") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports: [{ port: 8000 }]
  egress:
    - {{- toYaml $dns | nindent 6 }}
    - ports:
        {{- range $np.egressPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kb.fullname" . }}-worker
  labels: {{- include "kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kb.selector" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports: [{ port: 9100 }]
  egress:
    - {{- toYaml $dns | nindent 6 }}
    - ports:
        {{- range $np.egressPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kb.fullname" . }}-jobs
  labels: {{- include "kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [migrate, maintenance]
  policyTypes: [Ingress, Egress]
  egress:
    - {{- toYaml $dns | nindent 6 }}
    - ports: [{ protocol: TCP, port: 5432 }]
{{- end }}
