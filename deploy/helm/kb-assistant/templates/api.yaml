{{- $component := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kb.fullname" . }}-api
  labels:
    {{- include "kb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "kb.selector" $component | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "kb.selector" $component | nindent 8 }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kb.fullname" . }}
      {{- include "kb.podSecurity" (dict "uid" 10001) | nindent 6 }}
      containers:
        - name: api
          image: {{ include "kb.image" .Values.images.backend }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "kb.containerSecurity" . | nindent 10 }}
          {{- include "kb.backendEnv" . | nindent 10 }}
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: signing-key, mountPath: /run/secrets/kb, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: signing-key
          secret:
            secretName: {{ .Values.secrets.signingKey }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kb.fullname" . }}-api
  labels:
    {{- include "kb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "kb.selector" $component | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kb.fullname" . }}-api
  labels: {{- include "kb.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "kb.selector" $component | nindent 6 }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kb.fullname" . }}-api
  labels: {{- include "kb.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kb.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
