# Creates the demo tenants and users (same as `make seed`), once, as the schema
# owner. Restricted-compliant, like every pod in the `kb` namespace.
#
#   kubectl -n kb apply -f deploy/vm/seed-job.yaml && kubectl -n kb logs -f job/kb-seed
apiVersion: batch/v1
kind: Job
metadata:
  name: kb-seed
  namespace: kb
  labels:
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: maintenance
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: kb
        app.kubernetes.io/component: maintenance
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: ghcr.io/malakbenhassine/kb-assistant-backend:main
          imagePullPolicy: Always
          command: [python, -m, kb_assistant.cli, seed-demo]
          env:
            - name: KB_DATABASE__MIGRATION_URL
              valueFrom: { secretKeyRef: { name: kb-assistant-backend, key: KB_DATABASE__MIGRATION_URL } }
            - name: KB_SEED_PASSWORD
              valueFrom: { secretKeyRef: { name: kb-demo-seed, key: KB_SEED_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
