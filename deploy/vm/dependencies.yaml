# PostgreSQL (pgvector), Redis and SeaweedFS for a single-node k3s test
# environment (deploy/vm/bootstrap.sh applies this). In production these are
# managed services; here they run in their own namespace, outside the
# application's restricted one, with data on the node's local-path volumes.
#
# Credentials come from the `kb-deps` Secret created by bootstrap.sh. Each runs
# as its image's non-root user with a read-only root filesystem and no
# capabilities, like the application (checked by Trivy in the Security workflow).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kb-deps
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kb-deps
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # No legacy {SERVICE}_PORT=tcp://... variables: SeaweedFS reads S3_PORT as
      # its -s3.port flag and crashes on it. Services are found through DNS.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg17
          env:
            - { name: POSTGRES_USER, value: kb_owner }
            - { name: POSTGRES_DB, value: kb }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: kb-deps, key: POSTGRES_PASSWORD } }
            # Read by the init script, which creates the non-owner application role.
            - name: KB_APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: kb-deps, key: KB_APP_DB_PASSWORD } }
          ports: [{ name: postgres, containerPort: 5432 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [pg_isready, -U, kb_owner, -d, kb] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: init
          configMap: { name: postgres-init }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kb-deps
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: kb-deps
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      # No legacy {SERVICE}_PORT=tcp://... variables: SeaweedFS reads S3_PORT as
      # its -s3.port flag and crashes on it. Services are found through DNS.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: kb-deps, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: kb-deps
spec:
  selector: { app: s3 }
  ports: [{ name: s3, port: 8333 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  namespace: kb-deps
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels: { app: s3 }
  template:
    metadata:
      labels: { app: s3 }
    spec:
      # No legacy {SERVICE}_PORT=tcp://... variables: SeaweedFS reads S3_PORT as
      # its -s3.port flag and crashes on it. Services are found through DNS.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          # S3-compatible storage (ADR-0015); the same image as the compose stack.
          image: chrislusf/seaweedfs:4.48
          args: ["server", "-s3", "-dir=/data"]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: kb-deps, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: kb-deps, key: AWS_SECRET_ACCESS_KEY } }
          ports: [{ name: s3, containerPort: 8333 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
