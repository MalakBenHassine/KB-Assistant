# Local development stack: `make up`.
#
# Every published port is bound to 127.0.0.1. Secrets come from `.env`
# (generated by `make env`, git-ignored) and `${VAR:?}` makes a missing one a
# hard error instead of an empty password.

name: kb-assistant

x-backend: &backend
  build: ./backend
  image: kb-assistant-backend:local
  environment: &backend-env
    KB_ENVIRONMENT: local
    KB_DATABASE__URL: postgresql+asyncpg://kb_app:${KB_APP_DB_PASSWORD:?}@postgres:5432/kb
    KB_REDIS__URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    KB_STORAGE__ENDPOINT_URL: http://s3:8333
    KB_STORAGE__BUCKET: kb-documents
    KB_STORAGE__ACCESS_KEY: ${S3_ACCESS_KEY:?}
    KB_STORAGE__SECRET_KEY: ${S3_SECRET_KEY:?}
    # `hashing` works offline; set KB_EMBEDDINGS_PROVIDER=openai and OPENAI_API_KEY in .env
    # for real embeddings.
    KB_EMBEDDINGS__PROVIDER: ${KB_EMBEDDINGS_PROVIDER:-hashing}
    KB_EMBEDDINGS__API_KEY: ${OPENAI_API_KEY:-}
    # `extractive` answers offline by quoting sources; `openai` uses KB_LLM_MODEL.
    KB_LLM__PROVIDER: ${KB_LLM_PROVIDER:-extractive}
    KB_LLM__MODEL: ${KB_LLM_MODEL:-gpt-5.6-terra}
    KB_LLM__API_KEY: ${OPENAI_API_KEY:-}
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: kb_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: kb
      KB_APP_DB_PASSWORD: ${KB_APP_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    # Not published: only the containers need it. Use `docker compose exec postgres psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb_owner -d kb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible storage for uploaded originals. MinIO stopped publishing
    # community images in 2025 (ADR-0015); production uses a managed S3.
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      KB_DATABASE__MIGRATION_URL: postgresql+asyncpg://kb_owner:${POSTGRES_PASSWORD:?}@postgres:5432/kb
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    # Runs as your host user so it can read the 0600 signing key mounted below.
    user: "${KB_UID:-1000}:${KB_GID:-1000}"
    environment:
      <<: *backend-env
      KB_AUTH__PRIVATE_KEY_FILE: /run/secrets/jwt_signing_key
      KB_AUTH__KEY_ID: local-dev
      KB_STORAGE__CREATE_BUCKET: "true"
      # Rate limits (ADR-0018). The defaults match the application's; `make loadtest`
      # raises them for its run only.
      KB_LIMITS__CHAT_USER_PER_MINUTE: ${KB_LIMITS_CHAT_USER_PER_MINUTE:-10}
      KB_LIMITS__CHAT_USER_BURST: ${KB_LIMITS_CHAT_USER_BURST:-5}
      KB_LIMITS__CHAT_TENANT_PER_MINUTE: ${KB_LIMITS_CHAT_TENANT_PER_MINUTE:-300}
      KB_LIMITS__CHAT_TENANT_BURST: ${KB_LIMITS_CHAT_TENANT_BURST:-50}
    secrets:
      - jwt_signing_key
    ports:
      - "127.0.0.1:${KB_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["celery", "-A", "kb_assistant.worker.app", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A kb_assistant.worker.app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  web:
    build: ./web
    image: kb-assistant-web:local
    environment:
      # Server-side only (the BFF, ADR-0008): never exposed to the browser.
      KB_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${KB_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  seed:
    <<: *backend
    profiles: ["seed"]
    command: ["python", "-m", "kb_assistant.cli", "seed-demo"]
    environment:
      <<: *backend-env
      KB_DATABASE__MIGRATION_URL: postgresql+asyncpg://kb_owner:${POSTGRES_PASSWORD:?}@postgres:5432/kb
      KB_SEED_PASSWORD: ${KB_SEED_PASSWORD:?}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  jwt_signing_key:
    file: ./.secrets/jwt_signing_key.pem

volumes:
  postgres-data:
  redis-data:
  s3-data:
