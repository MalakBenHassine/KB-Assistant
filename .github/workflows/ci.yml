# Continuous integration: every pull request and every push to main.
# Actions are pinned by commit SHA (a tag can be moved; see ADR-0014).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Architecture (import contracts)
        run: uv run lint-imports
      - name: Tests (unit, integration, end-to-end; Postgres and Redis via testcontainers)
        run: uv run pytest --cov --cov-report=xml --cov-report=term --junitxml=junit.xml
      - name: Coverage gate on domain and application (>= 80 %)
        run: >-
          uv run coverage report --fail-under=80
          --include="src/kb_assistant/domain/*,src/kb_assistant/application/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/coverage.xml
            backend/junit.xml
          retention-days: 14

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    name: Image ${{ matrix.image }} (build and scan)
    needs: [backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          load: true
          tags: kb-assistant-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan the image (fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: kb-assistant-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  stack:
    name: Stack smoke test (docker compose)
    needs: [images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.15"
      - name: Start the stack exactly as `make up` does
        run: make up
      - name: Seed, then log in as a demo user and read the profile
        run: |
          make seed
          source .env
          token=$(curl -sf http://127.0.0.1:8000/v1/auth/login \
            -H 'content-type: application/json' \
            -d "{\"email\":\"alice@acme.example\",\"password\":\"${KB_SEED_PASSWORD}\"}" \
            | jq -r .access_token)
          curl -sf http://127.0.0.1:8000/v1/me -H "Authorization: Bearer ${token}" | jq -e '.role == "tenant_admin"'
          curl -sf http://127.0.0.1:3000/api/health | jq -e '.status == "ok"'
          echo "token=${token}" >> "${GITHUB_ENV}"
      - name: Upload a document and wait until the worker has indexed it
        run: |
          auth="Authorization: Bearer ${token}"
          hr=$(curl -sf http://127.0.0.1:8000/v1/departments -H "${auth}" \
            | jq -r '.items[] | select(.slug == "hr") | .id')
          printf '# Leave policy\n\nEmployees get 25 days of paid leave per year.\n' > leave.md
          document=$(curl -sf http://127.0.0.1:8000/v1/documents -H "${auth}" \
            -F "department_id=${hr}" -F "file=@leave.md;type=text/markdown" | jq -r .id)
          for _ in $(seq 1 30); do
            status=$(curl -sf "http://127.0.0.1:8000/v1/documents/${document}" -H "${auth}" \
              | jq -r .latest_version.status)
            echo "status: ${status}"
            [ "${status}" = "indexed" ] && break
            [ "${status}" = "failed" ] && exit 1
            sleep 2
          done
          [ "${status}" = "indexed" ] || exit 1
          echo "document=${document}" >> "${GITHUB_ENV}"
      - name: Ask a question and get a cited answer
        run: |
          auth="Authorization: Bearer ${token}"
          conversation=$(curl -sf http://127.0.0.1:8000/v1/conversations -H "${auth}" \
            -H 'content-type: application/json' -d '{}' | jq -r .id)
          curl -sf "http://127.0.0.1:8000/v1/conversations/${conversation}/messages" \
            -H "${auth}" -H 'content-type: application/json' \
            -d '{"question": "How many days of paid leave do employees get?"}' \
            | tee answer.json \
            | jq -e '.abstained == false and (.citations | length) > 0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
