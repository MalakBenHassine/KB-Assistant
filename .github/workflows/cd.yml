# Continuous delivery (ADR-0014).
#
# Runs only after CI has passed on main: a red build is never deployed.
# - Backend and web images: multi-architecture (amd64 + arm64), with SBOM and
#   provenance attestations, pushed to GHCR and signed with cosign keyless
#   (GitHub OIDC; there is no signing key to leak).
# - Web app: built and deployed to Vercel by this workflow, so Vercel's own Git
#   integration (disabled in web/vercel.json) cannot ship an untested commit.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }} image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Image name (registry paths must be lowercase)
        env:
          COMPONENT: ${{ matrix.image }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "${GITHUB_ENV}"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=main
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}-multiarch
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-multiarch
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  deploy-web:
    name: Deploy web to Vercel (production)
    needs: [publish]
    # Skipped, not failed, until the Vercel project is connected (see docs/DEPLOYMENT.md).
    if: vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production-web
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@60.1.3
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npx --yes "${VERCEL_CLI}" pull --yes --environment=production --token="${VERCEL_TOKEN}"
      - run: npx --yes "${VERCEL_CLI}" build --prod --token="${VERCEL_TOKEN}"
      - id: deploy
        run: |
          url=$(npx --yes "${VERCEL_CLI}" deploy --prebuilt --prod --token="${VERCEL_TOKEN}")
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
